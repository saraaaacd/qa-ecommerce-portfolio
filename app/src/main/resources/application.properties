spring.application.name=store
server.port=8080

# Base de datos en memoria: estado determinista por arranque (clave de QA)
spring.datasource.url=jdbc:h2:mem:store;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# Render siempre actualizado mientras desarrollamos
spring.thymeleaf.cache=false
spring.web.resources.cache.period=0

# Health check para CI
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# Incluir el mensaje de error en el body: util para que los tests de API
# puedan validar el detalle (a proposito para este entorno de demostracion)
server.error.include-message=always
server.error.include-stacktrace=never
server.error.include-exception=false