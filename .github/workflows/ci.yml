name: CI

# Triggers: push a main, pull requests y ejecucion manual
on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

env:
  QA_BROWSER: chrome
  QA_HEADLESS: "true"

jobs:
  test:
    name: QA suite (API + UI + A11y)
    runs-on: ubuntu-latest
    # Necesario para que GITHUB_TOKEN pueda hacer push a la rama gh_pages
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Arrancar el SUT en background
        run: |
          cd app
          sh ../mvnw -q spring-boot:run > /tmp/sut.log 2>&1 &
          APP_PID=$!
          echo "SUT PID=$APP_PID"
          READY=0
          for i in $(seq 1 90); do
            if curl -fsS http://localhost:8080/actuator/health >/dev/null 2>&1; then
              READY=1
              echo "SUT listo (intento $i)"
              break
            fi
            sleep 2
          done
          if [ "$READY" != "1" ]; then
            echo "El SUT no levanto:"
            tail -60 /tmp/sut.log
            exit 1
          fi
          echo "$APP_PID" > /tmp/sut.pid

      - name: Ejecutar la suite QA
        run: |
          cd qa
          sh ../mvnw -q test

      - name: Detener el SUT
        if: always()
        run: kill $(cat /tmp/sut.pid) 2>/dev/null || true

      - name: Subir resultados Allure (raw, artefacto)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: qa/target/allure-results
          if-no-files-found: warn

      - name: Generar el reporte HTML con Allure
        id: allure-report
        if: always()
        run: |
          cd qa
          sh ../mvnw -q io.qameta.allure:allure-maven:3.1.0:report

      - name: Subir el reporte Allure (artefacto)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: qa/target/allure-report
          if-no-files-found: warn

      - name: Publicar el reporte en GitHub Pages
        if: ${{ always() && github.ref == 'refs/heads/main' && steps.allure-report.outcome == 'success' }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh_pages
          publish_dir: qa/target/allure-report
          force_orphan: true